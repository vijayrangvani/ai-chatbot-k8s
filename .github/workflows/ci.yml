name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - name: Format check
        shell: bash
        run: |
          set +e
          ruff format --diff . > fmt.diff 2>&1; code=$?
          if [ $code -ne 0 ]; then head -20 fmt.diff | sed 's/^/::error::/'; fi   # show diff on run page
          exit $code
      - run: pytest
      - run: docker build -t app .
