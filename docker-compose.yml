# TEMPLATE: local dev stack = API + Postgres + Redis.
# Run from this folder:  docker compose up -d --build   |   stop: docker compose down   (-v also deletes data)
# Shape per service: image/build -> environment -> ports -> volumes -> depends_on -> healthcheck

services:
  # One-off job: apply DB migrations, then exit. The API waits for it to finish successfully.

  api:
    build: .                # build from the Dockerfile in that folder
    environment:
      # Service name "db" is the hostname inside the Compose network (not localhost!).
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/chatdb
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    ports:
      - "8000:8000"                          # host:container -> http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy           # wait until Postgres ACCEPTS connections, not just starts
      redis:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app                 # dev only; use secrets / .env in real setups
      POSTGRES_DB: chatdb
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume -> data survives `down`/rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d chatdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only, no disk


  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgdata:
  ollama_models:                                 # declared here, used above
