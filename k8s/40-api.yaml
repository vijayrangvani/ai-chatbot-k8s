# API: Deployment (2 replicas) + NodePort Service.
# Test from laptop: kubectl -n ai-chatbot port-forward svc/api 8000:80   (hits ONE pod only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-chatbot
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }              # MUST match template.metadata.labels below
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime: add 1 new before removing old
  template:
    metadata:
      labels: { app: api }                 # the Service finds pods by this label
    spec:
      containers:
        - name: api
          image: ai-chatbot-api:0.1
          imagePullPolicy: Never           # local image, never pulled from a registry
          ports:
            - containerPort: 8000
          envFrom:                         # load ALL keys as env vars
            - configMapRef: { name: ai-chatbot-config }
            - secretRef: { name: ai-chatbot-secret }
          env:
            - name: POD_NAME               # downward API: inject this pod's own name
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:                  # failing -> removed from Service (no traffic), NOT restarted
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:                   # failing -> container restarted
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-chatbot
spec:
  type: NodePort                           # reachable from outside the cluster on a node port
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8000
