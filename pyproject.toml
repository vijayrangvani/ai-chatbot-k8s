# One file for project metadata, dependencies AND tool config (ruff, pytest).
# Install for development:  pip install -e ".[dev]"   (-e = edits apply without reinstalling)

[project]
name = "ai-chatbot-k8s"                       # TODO: rename to your project
version = "0.1.0"
description = "AI chatbot (FastAPI + Ollama) with Redis cache and Postgres chat history, deployed on Kubernetes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]                    # src/ layout: tests run against the INSTALLED package, not loose files

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors  I: import order  B: likely bugs  UP: modern syntax  SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
